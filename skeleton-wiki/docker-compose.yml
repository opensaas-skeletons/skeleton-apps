services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skeleton_wiki
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "0.0.0.0:5435:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "0.0.0.0:3004:3004"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: skeleton_wiki
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 3004
      CORS_ORIGIN: "*"
      SEED_ON_START: "true"
    depends_on:
      db:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "0.0.0.0:5176:5176"
    environment:
      API_URL: http://server:3004
    depends_on:
      - server

volumes:
  pgdata:
