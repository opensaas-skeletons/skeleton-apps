services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: skeleton_automation
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "0.0.0.0:5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "0.0.0.0:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  server:
    build:
      context: .
      dockerfile: server/Dockerfile
    ports:
      - "0.0.0.0:3002:3002"
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: skeleton_automation
      DB_USER: postgres
      DB_PASSWORD: postgres
      PORT: 3002
      # CORS: Allow all origins in development. Restrict to specific origins in production.
      CORS_ORIGIN: "*"
      SEED_ON_START: "true"
      REDIS_URL: redis://redis:6379
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  client:
    build:
      context: .
      dockerfile: client/Dockerfile
    ports:
      - "0.0.0.0:5174:5174"
    environment:
      API_URL: http://server:3002
    depends_on:
      - server

volumes:
  pgdata:
